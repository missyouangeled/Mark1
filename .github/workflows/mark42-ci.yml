name: Mark42 CI

on:
  push:
    paths:
      - 'mark42-pkg/**'
      - '.github/workflows/mark42-ci.yml'
    branches: [master, main]
  pull_request:
    paths:
      - 'mark42-pkg/**'
      - '.github/workflows/mark42-ci.yml'

jobs:
  test:
    name: 测试 + 覆盖率 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-xdist pytest-subprocess
          pip install -e .
        working-directory: mark42-pkg
      
      - name: 版本一致性检查
        # 防回归：get_version() 与包元数据必须一致，且不能退回历史硬编码值 2.3.0
        run: |
          python -c "
          from importlib.metadata import version
          from mark42.config import get_version
          v_api, v_meta = get_version(), version('mark42')
          assert v_api == v_meta, f'版本不一致: get_version()={v_api} metadata={v_meta}'
          assert v_api != '2.3.0', '版本回归到了历史硬编码值 2.3.0'
          print('✅ 版本一致:', v_api)
          "
        working-directory: mark42-pkg

      - name: 运行测试
        run: |
          python -m pytest tests/ --cov=mark42 --cov-report=xml --cov-report=term-missing --tb=short -q --no-header
        working-directory: mark42-pkg
      
      - name: 覆盖率门禁 (≥ 65%)
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', '0'))
          pct = rate * 100
          print(f'覆盖率: {pct:.1f}%')
          if pct < 65:
              print(f'❌ 覆盖率 {pct:.1f}% 低于门禁 65%')
              exit(1)
          else:
              print(f'✅ 覆盖率 {pct:.1f}% 通过门禁 65%')
          "
        working-directory: mark42-pkg

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: 安装 ruff
        run: pip install ruff
      
      - name: Ruff 检查
        run: ruff check mark42-pkg/mark42/ mark42-pkg/tests/
      
      - name: 检查裸 except
        run: |
          result=$(grep -rn "except:" mark42-pkg/mark42/ --include="*.py" || true)
          if [ -n "$result" ]; then
            echo "⚠️ 发现裸 except:"
            echo "$result"
            exit 1
          else
            echo "✅ 无裸 except"
          fi
      
      - name: 检查 print 语句（daemon 函数应使用 logging）
        run: |
          result=$(grep -rn "^\s*print(" mark42-pkg/mark42/ --include="*.py" | grep -v "test_" | grep -v "__pycache__" || true)
          if [ -n "$result" ]; then
            echo "⚠️ 发现 print 语句:"
            echo "$result"
          else
            echo "✅ 无裸 print"
          fi
      
      - name: 检查 shell=True
        run: |
          result=$(grep -rn "shell=True" mark42-pkg/mark42/ --include="*.py" || true)
          if [ -n "$result" ]; then
            echo "❌ 发现 shell=True:"
            echo "$result"
            exit 1
          else
            echo "✅ 无 shell=True"
          fi

  build:
    name: 构建 + 安装冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build

      - name: 构建 wheel + sdist
        run: python -m build
        working-directory: mark42-pkg

      - name: 干净 venv 安装并冒烟测试
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install mark42-pkg/dist/*.whl
          /tmp/smoke/bin/mark42 --version
          /tmp/smoke/bin/mark42 --help > /dev/null
          echo "✅ wheel 可安装且 CLI 可执行"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mark42-dist
          path: mark42-pkg/dist/*
          retention-days: 7

  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: pip-audit 依赖漏洞扫描
        run: |
          pip install pip-audit
          cd mark42-pkg
          pip-audit --strict
      
      - name: 检查硬编码路径
        run: |
          # 允许 config.py 里带 env 覆盖的单一数据盘挂载点定义（MARK42_DATA_MOUNT）
          result=$(grep -rn "/mnt/data" mark42-pkg/mark42/ --include="*.py" | grep -v "#" | grep -v '"""' | grep -v "MARK42_DATA_MOUNT" || true)
          if [ -n "$result" ]; then
            echo "❌ 发现 /mnt/data 硬编码（应通过 config.DATA_MOUNT 派生）:"
            echo "$result"
            exit 1
          else
            echo "✅ 无 /mnt/data 硬编码（仅 config.py 单一 env 覆盖点）"
          fi
      
      - name: 检查硬编码 API key
        run: |
          result=$(grep -rnE "(sk-[a-zA-Z0-9]{20,}|ark-[a-zA-Z0-9-]{20,})" mark42-pkg/mark42/ --include="*.py" | grep -v test | grep -v mock | grep -v "#" || true)
          if [ -n "$result" ]; then
            echo "❌ 发现硬编码 API key:"
            echo "$result"
            exit 1
          else
            echo "✅ 无硬编码 API key"
          fi

  sbom:
    name: SBOM 生成
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        working-directory: mark42-pkg

      - name: 生成 SBOM
        run: |
          mkdir -p dist/sbom
          cyclonedx-py environment --pyproject pyproject.toml --of JSON -o dist/sbom/mark42-sbom.json
          echo "✅ SBOM 生成成功"
          # 打印组件数量
          python -c "
          import json
          with open('dist/sbom/mark42-sbom.json') as f:
              bom = json.load(f)
          print(f'组件数量: {len(bom.get("components", []))}')
          "
        working-directory: mark42-pkg

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@v4
        with:
          name: mark42-sbom
          path: mark42-pkg/dist/sbom/mark42-sbom.json
          retention-days: 30
